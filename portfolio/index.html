<link rel="icon" type="image/svg+xml" href="/img/xigong.png">

<style>
  :root{
    --bg:#0b0b0d;
    --panel:#131419;
    --ink:#f3f4f7;
    --muted:#9498a3;
    --line:#262833;
    --accent:#a3e635;
    --pop:#a3e635;
    transition:--pop .6s ease;
    --nav-w:262px;
    --display:"Archivo","Helvetica Neue",Arial,sans-serif;
    --body:"Inter","Helvetica Neue",Arial,sans-serif;
  }
  @property --pop{syntax:"<color>";inherits:true;initial-value:#a3e635;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;overflow-x:clip;}
  body{
    background-color:var(--scene,var(--bg));
    background-image:
      radial-gradient(46% 40% at 9% 13%,rgba(63,111,255,.10),transparent 72%),
      radial-gradient(44% 40% at 93% 90%,rgba(63,111,255,.07),transparent 72%);
    background-attachment:fixed;
    color:var(--ink);
    font-family:var(--body);line-height:1.6;overflow-x:clip;
    -webkit-font-smoothing:antialiased;
    transition:background-color .8s ease;
  }
  a{color:inherit;}

  /* A background-only spotlight; all links and content stay above it. */
  @media (hover:hover) and (pointer:fine) and (prefers-reduced-motion:no-preference){
    body::before{
      content:"";position:fixed;inset:0;z-index:1;pointer-events:none;
      background:radial-gradient(380px circle at var(--spotlight-x,-500px) var(--spotlight-y,-500px),
        rgba(163,230,53,.18),rgba(163,230,53,.07) 35%,transparent 75%);
      opacity:0;transition:opacity .2s ease;
    }
    body.spotlight-active::before{opacity:1;}
  }

  /* ---- accessibility: skip link + focus ---- */
  .skip{
    position:absolute;left:12px;top:-60px;z-index:200;
    background:var(--accent);color:#08111f;font-weight:600;
    padding:11px 18px;border-radius:8px;text-decoration:none;
    transition:top .18s ease;
  }
  .skip:focus{top:12px;}
  a:focus-visible,button:focus-visible{
    outline:3px solid var(--pop);outline-offset:3px;
  }

  /* ---- mobile hamburger toggle (hidden on desktop) ---- */
  .navtoggle{display:none;}

  /* ---- floating, borderless liquid-glass left nav ---- */
  .sidebar{
    position:fixed;left:22px;top:calc(clamp(96px,19vh,220px) - 16px);
    width:220px;max-height:calc(100vh - 44px);overflow-y:auto;
    padding:24px 20px;z-index:100;
    display:flex;flex-direction:column;
    background:rgba(18,19,25,.5);
    -webkit-backdrop-filter:blur(26px) saturate(180%);
    backdrop-filter:blur(26px) saturate(180%);
    border-radius:30px;
    box-shadow:0 24px 56px -26px rgba(0,0,0,.78);
  }
  .wordmark{text-decoration:none;display:block;padding:0 12px;}
  .wordmark .name{
    font-family:var(--display);font-weight:800;font-size:20px;
    letter-spacing:-.02em;line-height:1.05;
  }
  .status{
    display:flex;align-items:flex-start;gap:10px;
    padding:0 12px;margin-top:14px;min-height:54px;
  }
  .dot{
    width:7px;height:7px;border-radius:50%;background:var(--pop);
    flex:none;margin-top:4px;
  }
  .roll{overflow:hidden;}
  .roll__track{display:flex;flex-direction:column;}
  .roll__item{flex:none;}
  .roll--status{flex:1;height:54px;}
  .roll--status .roll__item{height:54px;font-size:12px;line-height:1.45;color:var(--muted);}
  .roll--word{display:inline-block;vertical-align:top;height:1.04em;}
  .roll--word .roll__item{height:1.04em;line-height:1.04;white-space:nowrap;color:var(--pop);}
  .nav{margin-top:16px;display:flex;flex-direction:column;gap:2px;}
  .nav a{
    display:flex;align-items:center;gap:10px;
    padding:9px 12px;border-radius:11px;
    font-size:15px;color:#aab0bd;text-decoration:none;
    background-image:linear-gradient(90deg,
      color-mix(in srgb,var(--pop) 24%,transparent) 0%,
      color-mix(in srgb,var(--pop) 24%,transparent) max(0%,calc(var(--p,0%) - 7%)),
      color-mix(in srgb,var(--pop) 46%,transparent) var(--p,0%),
      transparent var(--p,0%));
    transition:color .18s ease;
  }
  .nav a:hover{color:var(--ink);}
  .nav a[aria-current]{color:var(--ink);}
  .led{
    width:7px;height:7px;border-radius:50%;background:transparent;
    flex:none;transition:background .2s ease;
  }
  .nav a[aria-current] .led{background:var(--pop);}
  .nav .ext{margin-left:auto;font-size:12px;color:var(--muted);}
  .sidebar .foot{margin-top:20px;padding:18px 12px 0;border-top:1px solid rgba(255,255,255,.08);}
  .sidebar .foot a{
    text-decoration:none;font-size:14px;color:var(--ink);
    border-bottom:2px solid var(--pop);padding-bottom:2px;
  }
  .sidebar .foot .tiny{font-size:11px;color:var(--muted);margin-top:13px;}

  /* ---- main ---- */
  main{margin-left:var(--nav-w);}
  .inner{position:relative;z-index:2;max-width:1010px;padding:0 56px;margin:0 auto;}
  section{padding:90px 0;border-bottom:1px solid var(--line);}

  .eyebrow{
    font-size:12px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--pop);font-weight:600;
  }

  /* ---- hero : large image flush right ---- */
  .hero{
    position:relative;margin-left:calc(-1 * var(--nav-w));width:100vw;
    min-height:100vh;min-height:100lvh;display:flex;align-items:flex-start;
    padding:0;overflow:hidden;background:#000;
    border-bottom:1px solid var(--line);
  }
  .hero__img{
    position:absolute;top:-37%;right:-24%;
    height:158%;width:auto;aspect-ratio:1/1;z-index:0;object-fit:cover;object-position:center;
    -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 30%);
    mask-image:linear-gradient(90deg,transparent 0%,#000 30%);
    will-change:transform;
  }
  /* contrast scrim: darken the left (where the headline sits) + the bottom,
     while keeping the image subject on the right readable. Works over light art. */
  .hero__scrim{
    position:absolute;inset:0;z-index:0;
    background:
      linear-gradient(90deg,rgba(0,0,0,.82) 0%,rgba(0,0,0,.55) 34%,rgba(0,0,0,.12) 62%,rgba(0,0,0,0) 80%),
      linear-gradient(0deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 30%);
  }
  .hero .inner{
    position:relative;z-index:2;max-width:none;margin:0;width:100%;
    display:grid;grid-template-columns:minmax(0,1fr) clamp(240px,26vw,360px);
    gap:clamp(32px,5vw,80px);align-items:start;
    padding-top:clamp(96px,19vh,220px);
    padding-left:calc(var(--nav-w) + 16px);padding-right:56px;
  }
  .hero .eyebrow{margin-bottom:24px;}
  .hero-copy{min-width:0;}
  .hero-portrait{margin:0;text-align:center;}
  .hero-portrait img{
    display:block;width:100%;height:auto;aspect-ratio:1;object-fit:cover;
    border-radius:26px;border:1px solid var(--line);
  }
  .hero-portrait figcaption{margin-top:20px;font-size:24px;letter-spacing:.04em;color:var(--ink);}
  h1{
    font-family:var(--display);font-weight:800;
    font-size:clamp(38px,6vw,80px);line-height:1.04;letter-spacing:-.035em;
    text-shadow:0 2px 24px rgba(0,0,0,.55),0 1px 3px rgba(0,0,0,.5);
  }
  h1 .line{display:block;}
  h1 .word{display:inline-block;}
  /* fill-in-the-blank placeholders in the headline — swap "thing" + the blank */
  h1 .fill{border-bottom:4px dashed color-mix(in srgb,var(--pop) 55%,transparent);padding-bottom:.02em;}
  h1 .fill.blank{display:inline-block;min-width:2.6ch;}
  br.mb{display:none;}
  .hero-sub{
    margin-top:28px;font-size:clamp(17px,1.8vw,22px);
    color:#e6e8ee;max-width:42ch;
    text-shadow:0 1px 12px rgba(0,0,0,.6),0 1px 2px rgba(0,0,0,.5);
  }
  .hero-tagline{min-height:3.2em;line-height:1.6;}
  .tagline-accessible{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;}
  .tagline-cursor{display:inline-block;margin-left:.12em;color:var(--pop);}
  @media (prefers-reduced-motion: no-preference){
    .tagline-cursor{animation:tagline-blink 1s step-end infinite;}
  }
  @keyframes tagline-blink{50%{opacity:0;}}
  .scrollcue{
    position:absolute;z-index:2;bottom:34px;
    left:calc(var(--nav-w) + 16px);
    display:flex;align-items:center;gap:12px;
    font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
  }
  .scrollcue .ln{width:40px;height:1px;background:var(--muted);display:block;}

  /* ---- section heading ---- */
  .sec-head{
    display:flex;justify-content:space-between;align-items:flex-end;
    gap:24px;margin-bottom:36px;
  }
  .sec-head .eyebrow{margin-bottom:15px;}
  .sec-title{
    font-family:var(--display);font-weight:800;
    font-size:clamp(40px,6.4vw,88px);letter-spacing:-.03em;
    line-height:1;color:var(--ink);
  }
  .seeall{
    text-decoration:none;font-size:14px;color:var(--muted);white-space:nowrap;
    transition:color .18s ease;
  }
  .seeall:hover{color:var(--pop);}

  /* ---- generic blocks ---- */
  .bio{font-size:clamp(17px,1.65vw,20px);line-height:1.65;max-width:64ch;margin:0 0 1.4em 0;}
  .bio:last-of-type{margin-bottom:0;}
  .bio .hl{color:var(--pop);}
  .bio a{
    color:var(--pop);text-decoration:none;
    border-bottom:1px solid color-mix(in srgb,var(--pop) 45%,transparent);
    transition:border-color .18s ease;
  }
  .bio a:hover{border-color:var(--pop);}

  /* card grid (essays + lab) */
  .cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:24px;text-decoration:none;display:flex;flex-direction:column;
    min-height:214px;transition:transform .22s ease,border-color .22s ease;
  }
  .card:hover{transform:translateY(-5px);border-color:#3a3d4a;}
  .card .meta{font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;}
  .card .meta--pop{color:var(--pop);}
  .card h3{
    font-family:var(--display);font-weight:700;font-size:21px;
    line-height:1.18;letter-spacing:-.01em;margin-top:12px;
  }
  .card .desc{font-size:13.5px;line-height:1.46;color:var(--muted);margin-top:11px;max-width:42ch;}
  .card .go{margin-top:auto;font-size:14px;color:var(--pop);font-weight:600;padding-top:14px;}
  .card .go .ar{display:inline-block;transition:transform .22s ease;}
  .card:hover .go .ar{transform:translateX(6px);}
  .card--invite{min-height:0;}

  /* resume link in section head */
  .resume-link{
    display:inline-flex;align-items:center;gap:9px;white-space:nowrap;
    font-size:14px;font-weight:600;text-decoration:none;color:var(--ink);
    background:var(--panel);border:1px solid var(--line);
    border-radius:11px;padding:11px 16px;
    transition:border-color .2s ease,color .2s ease,transform .2s ease;
  }
  .resume-link:hover{border-color:var(--pop);color:var(--pop);transform:translateY(-2px);}
  .resume-link .ic{font-size:15px;}

  /* expanded case entries (public layer) — brand-tinted liquid glass */
  .cases{display:flex;flex-direction:column;gap:16px;margin-top:16px;}
  .case{
    --glow:var(--pop);
    position:relative;isolation:isolate;overflow:hidden;
    border:1px solid var(--line);border-radius:16px;padding:30px 32px;
    background:rgba(18,19,25,.46);
    -webkit-backdrop-filter:blur(22px) saturate(170%);
    backdrop-filter:blur(22px) saturate(170%);
    box-shadow:0 18px 44px -30px rgba(0,0,0,.7);
    transition:border-color .26s ease,box-shadow .26s ease,transform .26s ease;
  }
  .case::before{
    content:"";position:absolute;z-index:-1;pointer-events:none;
    width:360px;height:360px;border-radius:50%;
    right:-100px;top:-140px;
    background:radial-gradient(circle,var(--glow) 0%,transparent 68%);
    opacity:0;filter:blur(40px);
    transition:opacity .3s ease,transform .3s ease;
  }
  .case:hover{
    transform:translateY(-3px);
    border-color:color-mix(in srgb,var(--glow) 55%,var(--line));
    box-shadow:
      0 26px 60px -30px color-mix(in srgb,var(--glow) 65%,transparent),
      inset 0 0 0 1px color-mix(in srgb,var(--glow) 16%,transparent);
  }
  .case:hover::before{opacity:.7;transform:translate(-14px,18px);}
  .case__top{
    display:flex;justify-content:space-between;align-items:baseline;
    gap:20px;flex-wrap:wrap;
  }
  .case__co{
    font-family:var(--display);font-weight:800;
    font-size:clamp(26px,3.4vw,38px);letter-spacing:-.025em;line-height:1;
  }
  .case__yr{font-size:14px;color:var(--muted);white-space:nowrap;}
  .case__role{font-size:15px;color:var(--muted);margin-top:8px;}
  .case__hook{
    font-size:clamp(17px,1.8vw,21px);line-height:1.45;margin-top:18px;
    color:var(--ink);max-width:62ch;
  }
  .case__hook .num{color:var(--glow);font-weight:700;}
  .case__pts{list-style:none;margin-top:18px;display:flex;flex-direction:column;gap:11px;}
  .case__pts li{
    position:relative;padding-left:22px;font-size:15px;line-height:1.55;
    color:#c3c7d0;max-width:70ch;
  }
  .case__pts li::before{
    content:"";position:absolute;left:2px;top:9px;
    width:6px;height:6px;border-radius:50%;background:var(--glow);
  }
  .case__pts b{color:var(--ink);font-weight:600;}
  .case__earlier{
    --glow:var(--pop);
    position:relative;isolation:isolate;overflow:hidden;
    border:1px solid var(--line);border-radius:16px;padding:24px 32px;
    display:flex;justify-content:space-between;align-items:baseline;
    gap:20px;flex-wrap:wrap;
    box-shadow:0 18px 44px -30px rgba(0,0,0,.7);
    transition:border-color .26s ease,box-shadow .26s ease,transform .26s ease;
  }
  .case__earlier::before{
    content:"";position:absolute;z-index:-1;pointer-events:none;
    width:360px;height:360px;border-radius:50%;right:-100px;top:-140px;
    background:radial-gradient(circle,var(--glow) 0%,transparent 68%);
    opacity:0;filter:blur(40px);transition:opacity .3s ease,transform .3s ease;
  }
  .case__earlier:hover{
    transform:translateY(-3px);
    border-color:color-mix(in srgb,var(--glow) 55%,var(--line));
    box-shadow:
      0 26px 60px -30px color-mix(in srgb,var(--glow) 65%,transparent),
      inset 0 0 0 1px color-mix(in srgb,var(--glow) 16%,transparent);
  }
  .case__earlier:hover::before{opacity:.7;transform:translate(-14px,18px);}
  .case__earlier .lbl{
    font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:-.01em;
  }
  .case__earlier .desc{font-size:14px;color:var(--muted);max-width:58ch;}

  /* case-study spotlight strip (top of Selected Work) */
  .csgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:26px;}
  .cscard{
    --glow:var(--pop);
    display:flex;flex-direction:column;gap:10px;min-height:148px;text-decoration:none;
    background:rgba(255,255,255,.025);border:1px solid var(--line);border-radius:18px;
    padding:22px 24px;transition:border-color .2s ease,transform .2s ease,background .2s ease;
  }
  .cscard:hover{border-color:var(--glow);transform:translateY(-3px);background:rgba(255,255,255,.045);}
  .cscard:focus-visible{outline-color:var(--glow);}
  .cscard__co{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--glow);}
  .cscard__t{
    font-family:var(--display);font-weight:700;font-size:clamp(19px,2vw,24px);
    letter-spacing:-.02em;line-height:1.12;color:var(--ink);
  }
  .cscard__d{font-size:13.5px;line-height:1.46;color:var(--muted);max-width:42ch;}
  .cscard__go{margin-top:auto;display:inline-flex;align-items:center;gap:9px;font-size:13px;font-weight:600;color:var(--muted);}
  .cscard__go .lock{font-size:11px;opacity:.7;flex:none;}
  .cscard__go .ar{color:var(--glow);display:inline-block;transition:transform .2s ease;}
  .cscard:hover .cscard__go{color:#d4d7df;}
  .cscard:hover .cscard__go .ar{transform:translateX(5px);}
  .csnote{margin-top:18px;line-height:1.6;color:var(--muted);}
  .csnote a{color:var(--ink);text-decoration:underline;text-underline-offset:3px;transition:color .18s ease;}
  .csnote a:hover{color:var(--glow);}

  /* personal (external links) */
  .personal-link{
    display:inline-flex;align-items:center;gap:10px;margin-top:26px;
    font-family:var(--display);font-weight:600;font-size:clamp(20px,2.2vw,28px);
    letter-spacing:-.02em;text-decoration:none;color:var(--ink);
    border-bottom:2px solid var(--pop);padding-bottom:4px;
    transition:color .18s ease;
  }
  .personal-link:hover{color:var(--pop);}
  .listen{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px;}
  .listen a{
    display:inline-flex;align-items:center;gap:9px;
    padding:11px 18px;border-radius:999px;
    background:rgba(18,19,25,.5);
    -webkit-backdrop-filter:blur(18px) saturate(170%);
    backdrop-filter:blur(18px) saturate(170%);
    border:1px solid var(--line);
    font-size:14px;font-weight:600;color:var(--ink);text-decoration:none;
    transition:border-color .2s ease,color .2s ease,transform .2s ease;
  }
  .listen a:hover{border-color:var(--pop);color:var(--pop);transform:translateY(-2px);}
  .listen a .ar{font-size:12px;opacity:.7;}

  /* footer */
  footer{margin-left:var(--nav-w);background:var(--panel);padding:54px 0;border-top:1px solid var(--line);}
  .foot-grid{display:flex;justify-content:space-between;gap:30px;flex-wrap:wrap;}
  footer .big{
    font-family:var(--display);font-weight:800;
    font-size:clamp(26px,3vw,40px);letter-spacing:-.02em;line-height:1.08;
  }
  footer .big a{color:var(--pop);text-decoration:none;}
  footer .meta{font-size:13px;color:var(--muted);text-align:right;}
  footer .meta a{color:var(--ink);}

  /* ---- motion, gated behind reduced-motion preference ---- */
  @media (prefers-reduced-motion: no-preference){
    .reveal{opacity:0;transform:translateY(26px);
      transition:opacity .7s ease,transform .7s ease;}
    .reveal.in{opacity:1;transform:none;}
    h1 .word{opacity:0;transform:translateY(.5em);
      animation:rise .85s cubic-bezier(.2,.7,.2,1) forwards;}
    h1 .line:nth-child(1) .word{animation-delay:.12s;}
    h1 .line:nth-child(2) .word{animation-delay:.22s;}
    h1 .line:nth-child(3) .word{animation-delay:.32s;}
    .dot{animation:pulse 2.4s ease-in-out infinite;}
  }
  @keyframes rise{to{opacity:1;transform:none;}}
  @keyframes pulse{
    0%,100%{box-shadow:0 0 0 0 rgba(63,111,255,.5);}
    50%{box-shadow:0 0 0 7px rgba(63,111,255,0);}
  }

  /* ---- responsive: mobile hamburger ---- */
  @media (max-width:900px){
    :root{--nav-w:0px;}
    html{scroll-behavior:auto;}
    html,body{overscroll-behavior:none;}
    /* mobile perf: kill fixed bg + blur (they freeze scroll on some Androids) */
    body{background-attachment:scroll;background-image:none;}
    .sidebar,.case,.cscard,.listen a,.navtoggle{
      -webkit-backdrop-filter:none !important;backdrop-filter:none !important;
    }
    .sidebar{background:rgba(18,19,25,.94);}
    .case{background:var(--panel);}
    .listen a{background:var(--panel);}
    .navtoggle{background:rgba(18,19,25,.94);}

    .navtoggle{
      display:flex;align-items:center;justify-content:center;
      position:fixed;top:16px;left:16px;z-index:120;
      width:46px;height:46px;border:0;border-radius:14px;cursor:pointer;
      background:rgba(18,19,25,.62);
      -webkit-backdrop-filter:blur(22px) saturate(180%);
      backdrop-filter:blur(22px) saturate(180%);
      box-shadow:0 16px 36px -18px rgba(0,0,0,.8);
    }
    .bars,.bars::before,.bars::after{
      display:block;width:20px;height:2px;border-radius:2px;
      background:var(--ink);transition:transform .2s ease,opacity .2s ease;
    }

<script>
(function(){
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var onHome = true;
  var navObj = null;

  /* assemble email at runtime (keeps the raw address out of the HTML source) */
  document.querySelectorAll('a.email').forEach(function(a){
    var addr = a.getAttribute('data-user') + '@' + a.getAttribute('data-domain');
    a.setAttribute('href', 'mailto:' + addr);
    if(a.getAttribute('data-show') === 'true'){ a.textContent = addr; }
  });

  /* reveal-on-scroll */
  var io = new IntersectionObserver(function(es){
    es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
  }, {threshold:.14});
  document.querySelectorAll('.reveal').forEach(function(el){ io.observe(el); });

  var sections = [].slice.call(document.querySelectorAll('main section[id]'));
  function navLinkFor(id){ return document.querySelector('.nav a[href="#' + id + '"]'); }

  /* nav-item scroll-progress fill + subtle hero parallax */
  var ticking = false;
  var heroImg = document.querySelector('.hero__img');
  function updateNav(){
    var vh = window.innerHeight;
    if(heroImg && !reduce){
      if(window.innerWidth > 900){
        var py = Math.min(window.scrollY || 0, vh * 0.6) * 0.24;
        heroImg.style.transform = 'translate3d(0,' + py.toFixed(1) + 'px,0)';
      } else {
        heroImg.style.transform = '';
      }
    }
    sections.forEach(function(sec){
      var link = navLinkFor(sec.id);
      if(!link) return;
      var r = sec.getBoundingClientRect();
      var p = (vh * 0.82 - r.top) / Math.max(1, r.height * 0.6);
      p = p < 0 ? 0 : (p > 1 ? 1 : p);
      link.style.setProperty('--p', (p * 100).toFixed(1) + '%');
    });
    ticking = false;
  }
  function onScroll(){ if(!ticking){ ticking = true; requestAnimationFrame(updateNav); } }
  updateNav();
  window.addEventListener('scroll', onScroll, {passive:true});
  window.addEventListener('resize', onScroll);

  /* scroll-spy: active nav item + per-section background color shift */
  var scenes = {
    home:'#0b0b0d', who:'#0c0d12', thinking:'#0d0c10',
    lab:'#0b0e0f', work:'#0e0c0d', personal:'#0d0b11'
  };
  var pops = {
    home:'#a3e635', who:'#a3e635', thinking:'#a3e635',
    lab:'#a3e635', work:'#a3e635', personal:'#a3e635'
  };
  var vivid = ['#a3e635','#a3e635','#a3e635','#a3e635','#a3e635'];
  var vIdx = 0;
  function nextColor(){
    vIdx = (vIdx + 1) % vivid.length;
    document.documentElement.style.setProperty('--pop', vivid[vIdx]);
  }
  var spy = new IntersectionObserver(function(es){
    es.forEach(function(e){
      if(e.isIntersecting){
        document.querySelectorAll('.nav a').forEach(function(a){ a.removeAttribute('aria-current'); });
        var link = navLinkFor(e.target.id);
        if(link) link.setAttribute('aria-current', 'true');
        var sc = scenes[e.target.id];
        if(sc) document.documentElement.style.setProperty('--scene', sc);
        if(e.target.id === 'home'){
          document.documentElement.style.setProperty('--pop', vivid[vIdx]);
        } else {
          var pc = pops[e.target.id];
          if(pc) document.documentElement.style.setProperty('--pop', pc);
        }
        onHome = (e.target.id === 'home');
        if(onHome && navObj) navObj.resetTo("产品经理个人作品集");
      }
    });
  }, {rootMargin:'-45% 0px -50% 0px'});
  sections.forEach(function(s){ spy.observe(s); });

  /* mobile hamburger menu */
  var toggle = document.querySelector('.navtoggle');
  var sidebar = document.getElementById('primary-nav');
  if(toggle && sidebar){
    function setMenu(open){
      sidebar.classList.toggle('open', open);
      toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      toggle.setAttribute('aria-label', open ? '关闭菜单' : '打开菜单');
      if(open){
        var first = sidebar.querySelector('a');
        if(first) first.focus();
      }
    }
    toggle.addEventListener('click', function(){
      setMenu(toggle.getAttribute('aria-expanded') !== 'true');
    });
    sidebar.querySelectorAll('a').forEach(function(a){
      a.addEventListener('click', function(){ setMenu(false); });
    });
    document.addEventListener('keydown', function(e){
      if(e.key === 'Escape' && toggle.getAttribute('aria-expanded') === 'true'){
        setMenu(false);
        toggle.focus();
      }
    });
  }

  /* clipped-roll on a shared timer. The headline word rotates continuously;
     the nav status stays static on Home and only rotates off-Home. */
  function makeRoll(rollEl, words){
    if(!rollEl) return null;
    var track = rollEl.querySelector('.roll__track');
    var items = track.children;
    var i = 0;
    function paint(){
      items[0].textContent = words[i];
      items[1].textContent = words[(i + 1) % words.length];
    }
    paint();
    return {
      advance: function(){
        track.style.transition = 'transform .42s cubic-bezier(.16,.86,.26,1)';
        track.style.transform = 'translateY(-50%)';
        setTimeout(function(){
          i = (i + 1) % words.length;
          track.style.transition = 'none';
          track.style.transform = 'translateY(0)';
          paint();
          void track.offsetWidth;
        }, 460);
      },
      resetTo: function(word){
        var idx = words.indexOf(word);
        if(idx >= 0){ i = idx; }
        track.style.transition = 'none';
        track.style.transform = 'translateY(0)';
        paint();
        void track.offsetWidth;
      }
    };
  }
  navObj = null;
  var wordObj = null;
  var rollTimer = null;
  function startRolls(){
    if(!reduce && !rollTimer){
      rollTimer = setInterval(function(){
        if(wordObj) wordObj.advance();
        if(navObj && !onHome) navObj.advance();
        if(onHome) nextColor();
      }, 3400);
    }
  }
  function stopRolls(){ if(rollTimer){ clearInterval(rollTimer); rollTimer = null; } }
  if(!reduce){ setTimeout(startRolls, 1800); }
  if(sidebar){
    sidebar.addEventListener('mouseenter', stopRolls);
    sidebar.addEventListener('mouseleave', startRolls);
    sidebar.addEventListener('focusin', stopRolls);
    sidebar.addEventListener('focusout', startRolls);
  }
})();
</script>
